<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>스트로마톨라이트는 어떻게 만들어질까?</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --ground:#eef3f1; --panel:#ffffff; --ink:#16302c; --ink-2:#4a625d; --line:#cfdbd7;
  --accent:#1b6b78; --accent-ink:#ffffff; --ok:#2e7d4f; --ok-bg:#e3f2e8;
  --tab-bg:#dfe9e6; --shadow:0 10px 30px rgba(22,48,44,.10);
  --sans:"Pretendard","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0e1c1b; --panel:#152624; --ink:#dfe8e4; --ink-2:#9db3ad; --line:#2b403c;
    --accent:#4fb3c2; --accent-ink:#06191c; --ok:#7fd3a0; --ok-bg:#183327;
    --tab-bg:#1d3230; --shadow:0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ground:#0e1c1b; --panel:#152624; --ink:#dfe8e4; --ink-2:#9db3ad; --line:#2b403c;
  --accent:#4fb3c2; --accent-ink:#06191c; --ok:#7fd3a0; --ok-bg:#183327;
  --tab-bg:#1d3230; --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;font-weight:400}
button{font-family:inherit;font-size:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:14px 20px 28px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.brand h1{font-weight:800;font-size:clamp(22px,3vw,31px);margin:0;letter-spacing:-.02em;line-height:1.3;text-wrap:balance}
.brand p{margin:4px 0 0;color:var(--ink-2);font-size:14px;font-weight:500}
.tabs{display:flex;gap:6px;background:var(--tab-bg);padding:5px;border-radius:12px}
.tab{border:0;background:transparent;color:var(--ink-2);padding:9px 18px;border-radius:9px;font-weight:700;transition:background .2s,color .2s}
.tab[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.tab small{display:block;font-weight:400;font-size:12px;color:var(--ink-2)}
main{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(300px,1fr);gap:20px;margin-top:16px;align-items:start}
@media (max-width:900px){main{grid-template-columns:1fr}}
.left{display:flex;flex-direction:column;gap:10px;min-width:0}
.stage{position:relative;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.stage canvas{display:block;width:100%;height:auto;aspect-ratio:16/9}
.stage-bar{position:absolute;left:12px;right:12px;top:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:none}
.stage-bar[hidden]{display:none}
.stage-bar .tag{background:rgba(14,28,27,.72);color:#e9f0ee;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;backdrop-filter:blur(2px)}
.stage-bar .btn{pointer-events:auto;padding:7px 12px;font-size:14px;background:rgba(255,255,255,.92);color:#16302c;border-color:transparent}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;font-weight:500;color:var(--ink-2);padding:0 6px}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.panel{background:var(--panel);border-radius:16px;box-shadow:var(--shadow);padding:18px 20px 18px;display:flex;flex-direction:column;gap:12px;position:sticky;top:20px;max-height:calc(100vh - 40px);overflow-y:auto}
@media (max-width:900px){.panel{position:static;max-height:none;overflow-y:visible}}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--accent)}
.panel h2{font-weight:700;font-size:22px;margin:0;line-height:1.35;text-wrap:balance}
.panel .desc{margin:0;font-size:15px;font-weight:500}
.msg{border-radius:10px;padding:10px 12px;font-size:14px;font-weight:500;background:var(--tab-bg);line-height:1.55}
.msg.ok{background:var(--ok-bg);color:var(--ok);font-weight:600}
.refbox{font-size:13px;color:var(--ink-2);border-left:3px solid var(--line);padding:2px 0 2px 10px;line-height:1.5}
.refbox b{color:var(--ink);font-weight:700}
.steps{display:flex;gap:5px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps i.done{background:var(--accent)}
.steps i.cur{background:var(--accent);opacity:.5}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:11px 14px;border-radius:10px;font-weight:600;font-size:15px;transition:transform .08s,background .15s}
.btn:hover:not(:disabled){background:var(--tab-bg)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);background:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{width:100%;padding:13px 16px;font-size:16px;font-weight:700}
.q{margin:0;font-weight:600;font-size:14.5px;color:var(--ink-2)}
.card{position:relative;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:9px 42px 9px 14px;display:flex;flex-direction:column;gap:1px;line-height:1.45;transition:background .15s,border-color .15s}
.card:hover:not(:disabled){background:var(--tab-bg)}
.card .ct{font-weight:700;font-size:15px}
.card .cd{font-size:13px;color:var(--ink-2);font-weight:400}
.card .ck{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;background:var(--ok);color:#fff;display:none;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.card.done{border-color:var(--ok);background:var(--ok-bg)}
.card.done .ck{display:flex}
.card:disabled:not(.done){opacity:.5;cursor:not-allowed}
.card.done:disabled{opacity:1;cursor:default}
.count{display:flex;align-items:center;justify-content:space-between;background:var(--tab-bg);border-radius:10px;padding:7px 12px;font-size:14px;font-weight:500}
.count b{font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
footer{margin-top:20px;font-size:12.5px;color:var(--ink-2);text-align:center}
footer .copyright{margin:0;padding-top:12px;border-top:1px solid var(--line)}
footer .copyright a{color:inherit}
.hidden{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand">
    <h1>스트로마톨라이트는 어떻게 만들어질까?</h1>
    <p>남세균의 활동과 퇴적물이 만드는 층상 구조를 살펴보자.</p>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-teacher" aria-selected="true">교사 시연<small>한 층이 만들어지는 과정</small></button>
    <button class="tab" role="tab" id="tab-student" aria-selected="false">학생 체험<small>과정을 반복해 층 쌓기</small></button>
  </div>
</header>

<main>
  <div class="left">
    <div class="stage">
      <canvas id="cv" width="960" height="540" aria-label="해저 표면을 확대한 관찰 화면"></canvas>
      <div class="stage-bar" id="sec-bar" hidden><span class="tag" id="sec-tag">층의 단면</span><button class="btn" id="sec-close">단면 닫기</button></div>
    </div>
    <div class="legend">
      <span style="--c:#3f9a63">남세균</span><span style="--c:#bfe9ea">점액질</span><span style="--c:#d9b97a">퇴적물</span>
    </div>
  </div>

  <!-- 교사 시연 패널 -->
  <aside class="panel" id="panel-teacher">
    <div class="steps" id="stepbar" aria-hidden="true"></div>
    <div class="eyebrow" id="t-eyebrow">1단계 / 4</div>
    <h2 id="t-title"></h2>
    <p class="desc" id="t-desc"></p>
    <div class="msg ok" id="t-msg" aria-live="polite" hidden></div>
    <div class="refbox" id="t-ref" hidden><b>참고:</b> 실제 스트로마톨라이트는 환경에 따라 광물 침전의 영향과 전체 모양이 다양하게 나타납니다.</div>
    <div class="btnrow">
      <button class="btn" id="t-prev">◀ 이전</button>
      <button class="btn primary" id="t-next" style="flex:1">다음 단계 ▶</button>
      <button class="btn" id="t-reset">처음으로</button>
    </div>
  </aside>

  <!-- 학생 체험 패널 -->
  <aside class="panel hidden" id="panel-student">
    <h2>층이 만들어지는 과정을 반복해 보자</h2>
    <div class="msg" id="s-msg" aria-live="polite">바닥에 남세균 매트가 형성되어 있습니다. 다음에 일어날 과정을 선택해 보세요.</div>
    <p class="q">다음에는 어떤 과정이 일어날까요?</p>
    <button class="card" id="s-eps"><span class="ct">남세균이 점액질을 분비한다</span><span class="cd">끈끈한 점액질이 남세균 매트의 표면을 덮습니다.</span><span class="ck" aria-hidden="true">✓</span></button>
    <button class="card" id="s-sed"><span class="ct">퇴적물이 쌓인다</span><span class="cd">물에 실려 온 미세한 퇴적물이 점액질에 붙잡힙니다.</span><span class="ck" aria-hidden="true">✓</span></button>
    <button class="card" id="s-grow"><span class="ct">남세균이 성장한다</span><span class="cd">남세균은 햇빛을 받기 위해 쌓인 퇴적물 위로 이동해 다시 성장합니다.</span><span class="ck" aria-hidden="true">✓</span></button>
    <button class="btn primary big" id="s-next" hidden>다음 층 쌓기</button>
    <div class="count"><span>만들어진 층</span><b id="s-layers">0</b></div>
    <div class="btnrow">
      <button class="btn" id="s-section" style="flex:1.2" disabled>층의 단면 보기</button>
      <button class="btn" id="s-reset" style="flex:1">처음부터 다시</button>
    </div>
  </aside>
</main>

<footer>
  <p class="copyright">© 2026 제작: 김연경(<a href="mailto:earthssaem@gmail.com">earthssaem@gmail.com</a>)</p>
</footer>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv = $('cv'), ctx = cv.getContext('2d');
const W = 960, H = 540;
const FLOOR = 352;            // 해저 기준면의 세계 좌표 y(화면 중앙보다 조금 아래)
const N = 192, COLW = W / N;  // 표면을 나눈 열의 수
const LAYER_T = 28;           // 한 층의 기준 두께(세계 좌표 px)
const MAT_T = 12, EPS_T = 9;  // 매트·점액질 막의 두께
const FULL = 120;             // 매트를 이루는 남세균 가닥 수
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const easeOut = t => 1 - Math.pow(1 - t, 2);
const easeIO = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const dur = ms => REDUCED ? Math.max(280, ms * 0.3) : ms;

// 완만하고 조금 불규칙한 굴곡을 만드는 잡음
function smoothNoise(n, r = 5, passes = 4){
  let a = new Float32Array(n); for (let i = 0; i < n; i++) a[i] = Math.random() * 2 - 1;
  for (let p = 0; p < passes; p++){
    const b = new Float32Array(n);
    for (let i = 0; i < n; i++){ let s = 0, c = 0; for (let k = -r; k <= r; k++){ s += a[clamp(i + k, 0, n - 1)]; c++; } b[i] = s / c; }
    a = b;
  }
  let m = 0; for (const v of a) m = Math.max(m, Math.abs(v));
  for (let i = 0; i < n; i++) a[i] /= (m || 1);
  return a;
}
function baseProfile(){
  const nz = smoothNoise(N, 6, 4), ph = rand(0, 6.28), t = new Float32Array(N);
  for (let i = 0; i < N; i++){ const u = i / (N - 1); t[i] = 22 + 11 * Math.sin(u * Math.PI * 1.25 + ph) + 5 * Math.sin(u * Math.PI * 3.1 + ph * 1.7) + 7 * nz[i]; }
  return t;
}
// 바로 아래층의 굴곡을 따라가되 두께가 조금씩 다른 새 층
function layerProfile(prev, extra){
  const nz = smoothNoise(N, 7, 4), ph = rand(0, 6.28), t = new Float32Array(N);
  for (let i = 0; i < N; i++){ const u = i / (N - 1); const th = LAYER_T * (1 + 0.22 * nz[i] + 0.12 * Math.sin(u * Math.PI * 2.2 + ph)); t[i] = prev[i] + extra + Math.max(12, th); }
  return t;
}

// ---------- 애니메이션 제어(취소 가능) ----------
const anim = { id: 0 };
class Abort extends Error {}
function tween(ms, fn){
  const id = anim.id;
  return new Promise((res, rej) => {
    const t0 = performance.now();
    const f = () => {
      if (anim.id !== id){ rej(new Abort()); return; }
      const p = clamp((performance.now() - t0) / ms, 0, 1);
      if (fn(p) === true || p >= 1) res(); else requestAnimationFrame(f);
    };
    f();
  });
}
const cancelAnims = () => { anim.id++; };
const ignoreAbort = e => { if (!(e instanceof Abort)) throw e; };

// ---------- 시뮬레이션 상태 ----------
const sim = {
  base: null, layers: [], filaments: [], matCover: 0, eps: 0,
  heap: new Float32Array(N), heapGrains: [], particles: [], bubbles: [], hl: null,
  cam: { s: 1, A: FLOOR }, camS: 1, section: false, time: 0, dirty: true,
  get top(){ return this.layers.length ? this.layers[this.layers.length - 1].top : this.base; },
  get count(){ let n = 0; for (const L of this.layers) if (L.done) n++; return n; },   // 완성된 층 수
  surfW(c){ return FLOOR - this.top[clamp(Math.round(c), 0, N - 1)]; },   // 표면의 세계 y
  get off(){ return this.matCover * MAT_T + this.eps * EPS_T; },           // 매트·점액질 두께
};
const Y = w => sim.cam.A + (w - FLOOR) * sim.cam.s;                         // 세계 y → 화면 y
const bottomA = s => H - (H - FLOOR) * s;                                   // 화면 아래를 기준으로 고정
function setCam(s){ sim.cam.s = s; sim.cam.A = bottomA(s); sim.camS = s; sim.dirty = true; }
function camTo(s, A, ms){
  const s0 = sim.cam.s, A0 = sim.cam.A;
  return tween(ms, p => { const e = easeIO(p); sim.cam.s = lerp(s0, s, e); sim.cam.A = lerp(A0, A, e); sim.dirty = true; });
}
const stackTopW = () => { let m = 0; for (const v of sim.top) m = Math.max(m, v); return FLOOR - m; };
// 층이 화면 위쪽에 가까워지면 전체 구조가 보이도록 세로 비율을 부드럽게 축소(필요할 때만)
async function fitCamera(){
  const topW = stackTopW();
  if (Y(topW) >= 0.26 * H) return;
  const s = clamp(0.60 * H / (H - topW), 0.2, 1);
  sim.camS = s;
  await camTo(s, bottomA(s), dur(1000));
}

function spawnFilaments(n, alpha = 1){
  for (let k = 0; k < n; k++){
    const x = rand(4, W - 4);
    sim.filaments.push({ x, y: sim.surfW(x / COLW) - MAT_T * 0.55, len: rand(28, 54), amp: rand(2, 4), seed: rand(0, 6.28), hue: rand(126, 152), light: rand(44, 62), alpha, buried: false, mv: null, born: 0 });
  }
}
function commitLayer(top, grains){
  const prev = sim.top;
  sim.layers.push({ bottom: prev, top, h: rand(36, 44), s: rand(38, 50), l: rand(60, 70), lw: rand(1.4, 2.4), ll: rand(40, 52), age: 0, done: false, grains });
  sim.matCover = 0; sim.eps = 0; sim.heap.fill(0); sim.heapGrains = [];
  for (const f of sim.filaments) f.buried = true;
  sim.dirty = true;
}
function finishGrowth(){
  sim.filaments = sim.filaments.filter(f => !f.buried);
  for (const f of sim.filaments){ f.mv = null; f.alpha = 1; f.y = sim.surfW(f.x / COLW) - MAT_T * 0.55; }
  spawnFilaments(FULL - sim.filaments.length);
  sim.matCover = 1;
  if (sim.layers.length){ const L = sim.layers[sim.layers.length - 1]; L.age = 1; L.done = true; }
  sim.dirty = true;
}
// 단계 번호까지의 상태를 즉시 구성: 0 바닥만, 1 매트, 2 점액질, 3 퇴적층, 4 새 매트
function setState(stage){
  cancelAnims();
  sim.base = baseProfile(); sim.layers = []; sim.filaments = []; sim.matCover = 0; sim.eps = 0;
  sim.heap.fill(0); sim.heapGrains = []; sim.particles = []; sim.bubbles = []; sim.hl = null;
  setCam(1); sim.section = false;
  if (stage >= 1){ spawnFilaments(FULL); sim.matCover = 1; }
  if (stage >= 2) sim.eps = 1;
  if (stage >= 3) commitLayer(layerProfile(sim.top, MAT_T + EPS_T), bakeGrains([], sim.top, layerProfileLast()));
  if (stage >= 4) finishGrowth();
  sim.dirty = true;
}
function layerProfileLast(){ return sim.layers.length ? sim.layers[sim.layers.length - 1].top : sim.top; }
// 층에 남길 알갱이: 세계 x와 층 안에서의 상대 높이(0~1)
function bakeGrains(stuck, bottom, top){
  const g = stuck.map(q => { const ci = clamp(Math.round(q.x / COLW), 0, N - 1); const th = top[ci] - bottom[ci]; return { x: q.x, f: clamp(((FLOOR - q.y) - bottom[ci]) / th, 0.08, 0.92), r: q.r, col: q.col }; });
  while (g.length < 90){ const x = rand(0, W); g.push({ x, f: rand(0.1, 0.9), r: rand(1, 2.2), col: grainColor() }); }
  return g.slice(0, 140);
}
const grainColor = () => `hsl(${rand(34, 46)},${rand(35, 55)}%,${rand(48, 68)}%)`;

// ---------- 단계 애니메이션 ----------
// 남세균이 매트를 형성한다
async function matStep(){
  sim.filaments = []; sim.matCover = 0;
  const seeds = [rand(0.1, 0.3), rand(0.4, 0.6), rand(0.7, 0.9)].map(u => u * W);
  spawnFilaments(FULL, 0);
  for (const f of sim.filaments){ const d = Math.min(...seeds.map(s => Math.abs(s - f.x))); f.born = clamp(d / W * 2.2 + rand(0, 0.15), 0, 0.7); }
  await tween(dur(2800), p => {
    for (const f of sim.filaments) f.alpha = clamp((p - f.born) / 0.3, 0, 1);
    sim.matCover = clamp((p - 0.3) / 0.7, 0, 1);
  });
  for (const f of sim.filaments) f.alpha = 1; sim.matCover = 1;
}
// 남세균이 점액질을 분비한다
async function epsStep(){
  await tween(dur(2600), p => {
    sim.eps = easeIO(p);
    if (p < 0.85 && Math.random() < 0.5){ const f = sim.filaments[Math.floor(Math.random() * sim.filaments.length)]; if (f) sim.bubbles.push({ x: f.x, y: f.y - 2, vy: -rand(0.15, 0.35), r: rand(0.8, 1.8), a: 0.9, seed: rand(0, 6.28) }); }
  });
  sim.eps = 1;
}
// 퇴적물이 쌓인다 (sticky: 점액질이 있어 붙잡히는가)
async function sedimentStep(sticky){
  const prev = sim.top, target = layerProfile(prev, sim.off), inc = new Float32Array(N);
  for (let i = 0; i < N; i++) inc[i] = target[i] - prev[i] - sim.off;
  sim.heap.fill(0); sim.heapGrains = [];
  const total = 260; let made = 0;
  await tween(dur(3000), p => {
    const want = Math.floor(clamp(p / 0.72, 0, 1) * total);
    while (made < want){
      const c = rand(0, 12); const sy = sim.surfW(c) - sim.off;
      sim.particles.push({ x: -12 - rand(0, 50), y: sy - rand(10, 300), vx: rand(3, 5), vy: rand(0.3, 1.0), r: rand(1, 2.2), col: grainColor(), sticky, inc, st: 'flow', a: 1, rest: 0, cap: rand(0.55, 0.9), seed: rand(0, 6.28) });
      made++;
    }
  });
  if (sticky){
    // 남은 퇴적물이 매트 위에 얇고 불규칙하게 쌓인다
    const from = Float32Array.from(sim.heap);
    await tween(dur(800), p => { const e = easeIO(p); for (let i = 0; i < N; i++) sim.heap[i] = lerp(from[i], inc[i], e); for (const q of sim.particles) if (q.st === 'flow') q.a = 1 - e; });
    const stuck = sim.heapGrains.map(q => ({ x: q.x, y: q.y, r: q.r, col: q.col }));
    sim.particles = [];
    commitLayer(target, bakeGrains(stuck, prev, target));
  } else {
    await tween(dur(3200), p => { for (const q of sim.particles) if (q.st === 'flow') q.a = Math.min(q.a, 1 - p * 1.6); return sim.particles.length === 0; });
    sim.particles = []; sim.heap.fill(0); sim.heapGrains = [];
  }
}
// 남세균이 다시 성장한다: 일부 가닥이 퇴적물 위로 이동하고 새 표면을 따라 매트가 형성된다
async function growthStep(){
  const L = sim.layers[sim.layers.length - 1];
  const stay = [];
  for (const f of sim.filaments){
    if (f.buried && Math.random() < 0.45){ const x1 = clamp(f.x + rand(-14, 14), 4, W - 4); f.mv = { x0: f.x, y0: f.y, x1, y1: sim.surfW(x1 / COLW) - MAT_T * 0.55, d: rand(0, 0.5) }; f.buried = false; }
    else stay.push(f);
  }
  const fresh = [];
  await tween(dur(3000), p => {
    for (const f of sim.filaments){
      if (f.mv){ const t = easeOut(clamp((p - f.mv.d) / 0.5, 0, 1)); f.x = lerp(f.mv.x0, f.mv.x1, t); f.y = lerp(f.mv.y0, f.mv.y1, t) - Math.sin(t * Math.PI) * 3; if (t >= 1) f.mv = null; }
      else if (f.buried) f.alpha = 1 - 0.7 * p;
    }
    const want = Math.floor(clamp((p - 0.3) / 0.65, 0, 1) * (FULL * 0.6));
    while (fresh.length < want){ spawnFilaments(1, 0); const f = sim.filaments[sim.filaments.length - 1]; f.born = p; fresh.push(f); }
    for (const f of fresh) f.alpha = clamp((p - f.born) / 0.25, 0, 1);
    sim.matCover = clamp((p - 0.35) / 0.65, 0, 1);
    L.age = clamp((p - 0.15) / 0.85, 0, 1); sim.dirty = true;
  });
  finishGrowth();
  await fitCamera();
  // 이번에 만들어진 얇은 층의 경계를 잠시 강조
  sim.hl = { k: sim.layers.length - 1, t: 0 };
  await tween(dur(1600), p => { sim.hl.t = p; });
  sim.hl = null;
}

// 퇴적물이 새로 쌓이지 않은 상태에서 성장: 현재 표면의 남세균이 조금 늘어난다
async function smallGrowth(){
  const olds = sim.filaments.map(f => [f, f.len]);
  spawnFilaments(14, 0);
  const fresh = sim.filaments.slice(-14);
  for (const f of fresh) f.born = rand(0, 0.5);
  await tween(dur(1700), p => {
    for (const [f, l0] of olds) f.len = l0 * (1 + 0.06 * easeOut(p));
    for (const f of fresh) f.alpha = clamp((p - f.born) / 0.5, 0, 1);
  });
  for (const f of fresh) f.alpha = 1;
}
// 층의 단면 보기: 전체 구조를 화면에 맞게 확대해 경계를 살펴본다
async function openSection(){
  sim.section = true;
  const s = clamp(0.74 * H / (FLOOR - stackTopW()), 0.3, 2.4);
  await camTo(s, 0.9 * H, dur(900));
}
async function closeSection(){
  await camTo(sim.camS, bottomA(sim.camS), dur(800));
  sim.section = false;
}

// ---------- 매 프레임 물리 ----------
function update(){
  sim.time += 1 / 60;
  const ps = sim.particles;
  for (let i = ps.length - 1; i >= 0; i--){
    const q = ps[i];
    if (q.st === 'flow'){
      q.vx = clamp(q.vx + (Math.random() - 0.5) * 0.12, 2.2, 5.5); q.vy = Math.min(q.vy + 0.012, 1.3);
      q.x += q.vx; q.y += q.vy + Math.sin(sim.time * 4 + q.seed) * 0.2;
      if (q.x > W + 12 || q.a <= 0){ ps.splice(i, 1); continue; }
      const c = clamp(q.x / COLW, 0, N - 1), ci = Math.round(c);
      const sy = sim.surfW(c) - sim.off - sim.heap[ci];
      if (q.y >= sy - q.r){
        if (q.sticky && Math.random() < 0.7){
          q.st = 'stuck'; q.y = sy - q.r * 0.5; sim.heapGrains.push(q);
          const add = 0.3 + (q.inc[ci] - sim.heap[ci]) * 0.06;
          sim.heap[ci] = Math.min(q.inc[ci] * q.cap, sim.heap[ci] + add);
          for (let k = 1; k <= 6; k++){ const v = sim.heap[ci] - k * 0.12; if (ci - k >= 0) sim.heap[ci - k] = Math.min(q.inc[ci - k] * q.cap, Math.max(sim.heap[ci - k], v)); if (ci + k < N) sim.heap[ci + k] = Math.min(q.inc[ci + k] * q.cap, Math.max(sim.heap[ci + k], v)); }
        } else if (q.sticky){ q.st = 'skim'; q.y = sy - q.r; }
        else { q.st = 'rest'; q.y = sy - q.r * 0.6; q.rest = rand(25, 75); }
      }
    } else if (q.st === 'skim'){
      q.x += q.vx; const c = clamp(q.x / COLW, 0, N - 1); q.y = sim.surfW(c) - sim.off - sim.heap[Math.round(c)] - q.r;
      if (q.x > W + 12) ps.splice(i, 1);
    } else if (q.st === 'rest'){
      if (--q.rest <= 0){ q.st = 'wash'; q.vx = rand(2, 3.5); }
    } else if (q.st === 'wash'){
      q.x += q.vx; q.y -= 0.15; q.a -= 0.012; if (q.a <= 0 || q.x > W + 12) ps.splice(i, 1);
    }
  }
  for (let i = sim.bubbles.length - 1; i >= 0; i--){ const b = sim.bubbles[i]; b.y += b.vy; b.a -= 0.015; b.x += Math.sin(sim.time * 5 + b.seed) * 0.2; if (b.a <= 0) sim.bubbles.splice(i, 1); }
}

// ---------- 그리기 ----------
const sc = document.createElement('canvas'), sctx = sc.getContext('2d');
let DPR = 1;
function fitDPR(){ DPR = Math.min(2, devicePixelRatio || 1); cv.width = sc.width = W * DPR; cv.height = sc.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); sctx.setTransform(DPR, 0, 0, DPR, 0, 0); sim.dirty = true; }
fitDPR(); addEventListener('resize', fitDPR);

function pathBetween(c, bot, top){
  c.beginPath();
  for (let i = 0; i < N; i++){ const x = i * COLW, y = Y(FLOOR - top[i]); i ? c.lineTo(x, y) : c.moveTo(x, y); }
  c.lineTo(W, Y(FLOOR - top[N - 1])); c.lineTo(W, Y(FLOOR - bot[N - 1]));
  for (let i = N - 1; i >= 0; i--) c.lineTo(i * COLW, Y(FLOOR - bot[i]));
  c.closePath();
}
function pathAlong(c, prof, dy = 0){
  c.beginPath();
  for (let i = 0; i < N; i++){ const x = i * COLW, y = Y(FLOOR - prof[i]) + dy; i ? c.lineTo(x, y) : c.moveTo(x, y); }
  c.lineTo(W, Y(FLOOR - prof[N - 1]) + dy);
}
// 이미 만들어진 층들은 정적 캔버스에 합성해 두고 바뀔 때만 다시 그린다
function renderStatic(){
  const c = sctx; c.clearRect(0, 0, W, H);
  const gy = Y(FLOOR - 40), g = c.createLinearGradient(0, gy, 0, H);
  g.addColorStop(0, '#c9a868'); g.addColorStop(1, '#7c5f36'); c.fillStyle = g;
  const zero = new Float32Array(N).fill(-(H - FLOOR) / Math.max(sim.cam.s, 0.05));
  pathBetween(c, zero, sim.base); c.fill();
  for (const L of sim.layers){
    c.fillStyle = `hsl(${L.h},${L.s}%,${L.l}%)`; pathBetween(c, L.bottom, L.top); c.fill();
    c.save(); pathBetween(c, L.bottom, L.top); c.clip(); c.globalAlpha = 0.8;
    for (const q of L.grains){ const ci = clamp(Math.round(q.x / COLW), 0, N - 1); const y = Y(FLOOR - lerp(L.bottom[ci], L.top[ci], q.f)); c.fillStyle = q.col; c.beginPath(); c.arc(q.x, y, Math.max(0.6, q.r * Math.min(1, sim.cam.s + 0.3)), 0, 6.283); c.fill(); }
    c.restore();
    // 묻힌 이전 매트: 초록에서 채도 낮은 갈색·회색 경계로
    const a = L.age;
    c.strokeStyle = `hsl(${lerp(140, 28, a)},${lerp(45, 14, a)}%,${lerp(38, L.ll, a)}%)`;
    c.lineWidth = Math.max(1, lerp(3, L.lw, a) * Math.min(1, sim.cam.s + 0.4)); c.globalAlpha = 0.9;
    pathAlong(c, L.bottom, 0.5); c.stroke(); c.globalAlpha = 1;
  }
  sim.dirty = false;
}
function draw(){
  const t = sim.time;
  ctx.clearRect(0, 0, W, H);
  // 물: 위쪽은 밝고 아래로 갈수록 짙다. 햇빛은 수면 위쪽의 은은한 배경으로만
  let g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#b8e2e4'); g.addColorStop(0.55, '#4a9aa6'); g.addColorStop(1, '#1f6f7c');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  g = ctx.createLinearGradient(0, 0, 0, H * 0.45);
  g.addColorStop(0, 'rgba(255,247,215,.55)'); g.addColorStop(1, 'rgba(255,247,215,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H * 0.45);
  ctx.save(); ctx.globalAlpha = 0.04; ctx.fillStyle = '#fff8dc';
  for (let k = 0; k < 5; k++){ const x0 = 60 + k * 230 + Math.sin(t * 0.25 + k * 1.9) * 30; ctx.beginPath(); ctx.moveTo(x0, 0); ctx.lineTo(x0 + 90, 0); ctx.lineTo(x0 - 30, H * 0.7); ctx.lineTo(x0 - 130, H * 0.7); ctx.closePath(); ctx.fill(); }
  ctx.restore();
  ctx.save(); ctx.globalAlpha = 0.3; ctx.strokeStyle = '#eafcff'; ctx.lineWidth = 2; ctx.beginPath();
  for (let x = 0; x <= W; x += 8) ctx.lineTo(x, 12 + Math.sin(x * 0.025 + t * 1.2) * 2.5); ctx.stroke(); ctx.restore();

  if (sim.dirty) renderStatic();
  ctx.drawImage(sc, 0, 0, W, H);

  const s = sim.cam.s, top = sim.top;
  const matT = Math.max(3, MAT_T * s) * sim.matCover, epsT = Math.max(3, EPS_T * s) * sim.eps;
  // 현재 표면의 남세균 매트(얇은 초록 띠)
  if (sim.matCover > 0.01){
    ctx.save(); ctx.globalAlpha = 0.8 * sim.matCover; ctx.fillStyle = '#256b43';
    pathAlong(ctx, top, -matT); for (let i = N - 1; i >= 0; i--) ctx.lineTo(i * COLW, Y(FLOOR - top[i]) + 1); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  // 점액질: 매트 표면을 덮는 얇고 반투명한 막
  if (sim.eps > 0.01){
    ctx.save(); ctx.globalAlpha = 0.6 * sim.eps; ctx.fillStyle = '#c9f0f2';
    pathAlong(ctx, top, -matT - epsT); for (let i = N - 1; i >= 0; i--) ctx.lineTo(i * COLW, Y(FLOOR - top[i]) - matT + 0.5); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 0.55 * sim.eps; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.2;
    ctx.beginPath(); for (let i = 0; i < N; i++){ const x = i * COLW, y = Y(FLOOR - top[i]) - matT - epsT + 0.8 + Math.sin(i * 0.45 + t * 1.5) * 0.6; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke();
    ctx.restore();
  }
  // 쌓이는 중인 퇴적물
  let heapMax = 0; for (const v of sim.heap) heapMax = Math.max(heapMax, v);
  if (heapMax > 0.05){
    const off = sim.off; ctx.fillStyle = '#d9b97a';
    ctx.beginPath();
    for (let i = 0; i < N; i++){ const x = i * COLW, y = Y(FLOOR - top[i] - off - sim.heap[i]); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    for (let i = N - 1; i >= 0; i--) ctx.lineTo(i * COLW, Y(FLOOR - top[i] - off) + 0.5);
    ctx.closePath(); ctx.fill();
    for (const q of sim.heapGrains){ ctx.fillStyle = q.col; ctx.beginPath(); ctx.arc(q.x, Y(q.y), q.r, 0, 6.283); ctx.fill(); }
  }
  // 남세균 가닥: 현재 표면의 것만 선명하고, 퇴적물에 덮인 것은 흐리게
  ctx.lineCap = 'round';
  for (const f of sim.filaments){
    const ci = clamp(Math.round(f.x / COLW), 0, N - 1);
    const covered = f.buried || (sim.heap[ci] > 1.5 && !f.mv);
    const a = f.alpha * (covered ? 0.35 : 1); if (a <= 0.02) continue;
    const yc = Y(f.y), half = f.len / 2, onSurf = !covered && !f.mv;
    const dy = onSurf ? (Y(sim.surfW((f.x + half) / COLW)) - Y(sim.surfW((f.x - half) / COLW))) : 0;
    ctx.strokeStyle = `hsla(${f.hue},55%,${f.light}%,${a})`; ctx.lineWidth = 2.8;
    ctx.beginPath();
    for (let k = 0; k <= 10; k++){ const u = k / 10; const x = f.x - half + f.len * u; const y = yc + dy * (u - 0.5) + Math.sin(u * 6.5 + f.seed + t * 1.3) * f.amp; k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.stroke();
  }
  // 물의 흐름을 따라 들어오는 퇴적물
  for (const q of sim.particles){ if (q.st === 'stuck') continue; ctx.globalAlpha = q.a; ctx.fillStyle = q.col; ctx.beginPath(); ctx.arc(q.x, Y(q.y), q.r, 0, 6.283); ctx.fill(); }
  ctx.globalAlpha = 1;
  for (const b of sim.bubbles){ ctx.globalAlpha = b.a * 0.6; ctx.fillStyle = '#e4fbfb'; ctx.beginPath(); ctx.arc(b.x, Y(b.y), b.r, 0, 6.283); ctx.fill(); }
  ctx.globalAlpha = 1;
  // 단면 보기: 각 층의 경계를 얇은 선과 은은한 강조로 표시
  if (sim.section){
    ctx.save();
    for (let k = 0; k <= sim.layers.length; k++){
      const prof = k < sim.layers.length ? sim.layers[k].bottom : sim.top;
      ctx.globalAlpha = 0.45; ctx.strokeStyle = '#fff6d8'; ctx.lineWidth = 4; pathAlong(ctx, prof, 0.5); ctx.stroke();
      ctx.globalAlpha = 0.85; ctx.strokeStyle = '#4a3f33'; ctx.lineWidth = 1.2; pathAlong(ctx, prof, 0.5); ctx.stroke();
    }
    ctx.restore();
  }
  // 새로 만들어진 층의 경계 강조
  if (sim.hl){
    const L = sim.layers[sim.hl.k]; const a = Math.sin(sim.hl.t * Math.PI);
    ctx.save(); ctx.globalAlpha = a * 0.22; ctx.fillStyle = '#fff8d6'; pathBetween(ctx, L.bottom, L.top); ctx.fill();
    ctx.globalAlpha = a * 0.95; ctx.strokeStyle = '#fff4c2'; ctx.lineWidth = 2.2; ctx.shadowColor = 'rgba(255,244,194,.9)'; ctx.shadowBlur = 8;
    pathAlong(ctx, L.bottom); ctx.stroke(); pathAlong(ctx, L.top); ctx.stroke();
    ctx.restore();
  }
}
sim.base = baseProfile();
(function loop(){ update(); draw(); requestAnimationFrame(loop); })();

// ---------- 교사 시연 ----------
const STEPS = [
  { title: '남세균이 매트를 형성한다', desc: '얕은 바다 바닥에서 남세균이 모여 얇은 매트를 형성합니다.', run: matStep },
  { title: '남세균이 점액질을 분비한다', desc: '남세균이 끈끈한 점액질을 분비합니다.', run: epsStep },
  { title: '퇴적물이 쌓인다', desc: '물에 실려 온 미세한 퇴적물이 점액질에 붙잡혀 쌓입니다.', run: () => sedimentStep(true) },
  { title: '남세균이 다시 성장한다', desc: '남세균은 햇빛을 받기 위해 쌓인 퇴적물 위로 이동해 다시 성장합니다.', run: growthStep, done: '이 과정으로 하나의 얇은 층이 만들어집니다.' },
];
let stepIdx = 0, tBusy = false, tDone = false;
const stepbar = $('stepbar');
STEPS.forEach(() => stepbar.appendChild(document.createElement('i')));
function renderTeacher(){
  const S = STEPS[stepIdx];
  $('t-eyebrow').textContent = `${stepIdx + 1}단계 / ${STEPS.length}`;
  $('t-title').textContent = S.title; $('t-desc').textContent = S.desc;

  $('t-msg').hidden = !(S.done && tDone); $('t-msg').textContent = S.done || '';
  $('t-ref').hidden = stepIdx !== STEPS.length - 1;

  $('t-next').disabled = tBusy || stepIdx === STEPS.length - 1;

}
async function playTeacher(i){
  setState(i); stepIdx = i; tDone = false; tBusy = true; renderTeacher();
  const id = anim.id;
  try { await STEPS[i].run(); tDone = true; }
  catch (e){ ignoreAbort(e); return; }

}
$('t-next').addEventListener('click', () => { if (!tBusy && stepIdx < STEPS.length - 1) playTeacher(stepIdx + 1); });
$('t-prev').addEventListener('click', () => { if (stepIdx > 0) playTeacher(stepIdx - 1); });
$('t-reset').addEventListener('click', () => playTeacher(0));

// ---------- 학생 체험 ----------
const sdone = { eps: false, sed: false, grow: false };
let sBusy = false, sLocked = false, sSection = false, msgBefore = '';
const START_MSG = '바닥에 남세균 매트가 형성되어 있습니다. 다음에 일어날 과정을 선택해 보세요.';
function setMsg(text, kind){ const m = $('s-msg'); m.textContent = text; m.className = 'msg' + (kind ? ' ' + kind : ''); }
function renderStudent(){
  for (const k of ['eps', 'sed', 'grow']){ const el = $('s-' + k); el.classList.toggle('done', sdone[k]); el.disabled = sBusy || sLocked || sSection || sdone[k]; el.setAttribute('aria-label', el.querySelector('.ct').textContent + (sdone[k] ? ' (완료)' : '')); }
  $('s-layers').textContent = sim.count;
  document.querySelector('#panel-student .q').hidden = sLocked;
  $('s-next').hidden = !sLocked; $('s-next').disabled = sBusy || sSection;
  $('s-section').disabled = sBusy || sim.count < 2;
  $('s-section').textContent = sSection ? '단면 닫기' : '층의 단면 보기';
  $('s-reset').disabled = sBusy || sSection;
  $('sec-bar').hidden = !sSection; $('sec-close').disabled = sBusy;
  $('sec-tag').textContent = `층의 단면 · 만들어진 층 ${sim.count}개`;
}
async function studentAction(key){
  if (sBusy || sLocked || sSection || sdone[key]) return;
  sBusy = true; renderStudent();
  const id = anim.id;
  try {
    if (key === 'eps'){
      setMsg('남세균이 점액질을 분비합니다. 매트 표면이 얇은 막으로 덮입니다.');
      await epsStep(); sdone.eps = true;
      setMsg('점액질이 남세균 매트의 표면을 덮었습니다.');
    } else if (key === 'sed'){
      if (sdone.eps){
        setMsg('물에 실려 온 퇴적물이 들어옵니다. 일부는 점액질에 붙잡히고 일부는 계속 흘러갑니다.');
        await sedimentStep(true); sdone.sed = true;
        setMsg('퇴적물이 점액질에 붙잡혀 매트 위에 얇게 쌓였습니다.');
      } else {
        setMsg('물에 실려 온 퇴적물이 들어옵니다…');
        await sedimentStep(false);
        setMsg('퇴적물이 내려앉았지만, 붙잡아 줄 점액질이 없어 대부분 물에 쓸려 갔습니다.');
      }
    } else {
      if (sdone.sed){
        setMsg('남세균이 쌓인 퇴적물 위로 이동해 새 표면에서 다시 성장합니다.');
        await growthStep(); sdone.grow = true; sLocked = true;
        setMsg('층이 1개 더 만들어졌습니다.', 'ok');
      } else {
        setMsg('남세균이 현재 표면에서 성장합니다…');
        await smallGrowth();
        setMsg('남세균이 현재 표면에서 성장했습니다. 아직 새 퇴적물이 쌓이지 않아 새로운 층은 만들어지지 않았습니다.');
      }
    }
  } catch (e){ ignoreAbort(e); return; }
  finally { if (anim.id === id){ sBusy = false; renderStudent(); } }
}
$('s-eps').addEventListener('click', () => studentAction('eps'));
$('s-sed').addEventListener('click', () => studentAction('sed'));
$('s-grow').addEventListener('click', () => studentAction('grow'));
$('s-next').addEventListener('click', () => {
  if (sBusy || sSection || !sLocked) return;
  sdone.eps = sdone.sed = sdone.grow = false; sLocked = false;
  setMsg('다음에 일어날 과정을 선택해 보세요.'); renderStudent();
});
async function toggleSection(){
  if (sBusy || (!sSection && sim.count < 2)) return;
  sBusy = true; const id = anim.id;
  try {
    if (!sSection){ sSection = true; msgBefore = $('s-msg').textContent; renderStudent(); setMsg('지금까지 만들어진 층의 단면입니다. 각 층의 경계를 살펴보세요. 닫으면 이어서 층을 쌓을 수 있습니다.'); await openSection(); }
    else { await closeSection(); sSection = false; setMsg(msgBefore); }
  } catch (e){ ignoreAbort(e); return; }
  finally { if (anim.id === id){ sBusy = false; renderStudent(); } }
}
$('s-section').addEventListener('click', toggleSection);
$('sec-close').addEventListener('click', toggleSection);
function resetStudent(){ setState(1); sdone.eps = sdone.sed = sdone.grow = false; sBusy = false; sLocked = false; sSection = false; setMsg(START_MSG); renderStudent(); }
$('s-reset').addEventListener('click', resetStudent);

// ---------- 탭 ----------
let mode = 'teacher';
function setMode(m){
  mode = m;
  $('tab-teacher').setAttribute('aria-selected', m === 'teacher'); $('tab-student').setAttribute('aria-selected', m === 'student');
  $('panel-teacher').classList.toggle('hidden', m !== 'teacher'); $('panel-student').classList.toggle('hidden', m !== 'student');
  cancelAnims(); tBusy = false; sBusy = false; sSection = false; $('sec-bar').hidden = true;
  if (m === 'teacher') playTeacher(0); else resetStudent();
  try { localStorage.setItem('strom-mode', m); } catch (e) {}
}
$('tab-teacher').addEventListener('click', () => setMode('teacher'));
$('tab-student').addEventListener('click', () => setMode('student'));
let initial = 'teacher'; try { initial = localStorage.getItem('strom-mode') || 'teacher'; } catch (e) {}
setMode(initial);
})();
</script>
